
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#6750A4">
    <title>SWF 播放器</title>

    <!-- 主题：在首屏绘制前应用，避免深色模式闪白 -->
    <script>
    (function () {
        try {
            var t = localStorage.getItem('swf-theme');
            if (t !== 'dark' && t !== 'light') t = 'light'; // 默认浅色
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    })();
    </script>

    <!-- Ruffle：多 CDN 冗余（unpkg / jsdelivr）+ 本地兜底 -->
    <script>
    (function () {
        // 本地兜底：相对当前目录解析，部署在 /swf/ 时即 /swf/ruffle-0.4.1/ruffle.js
        var LOCAL = new URL('ruffle-0.4.1/ruffle.js', document.baseURI).href;
        var CDNS = [
            'https://unpkg.com/@ruffle-rs/ruffle',
            'https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle'
        ];
        var KEY = 'ruffle-src-ok';   // 记住上次可用的 CDN，下次优先用它
        var TIMEOUT = 8000;          // 单个源的最长等待（防止 CDN 挂起不报错）

        try {
            var i = CDNS.indexOf(localStorage.getItem(KEY));
            if (i > 0) CDNS.unshift(CDNS.splice(i, 1)[0]);
        } catch (e) {}

        var SOURCES = CDNS.concat([LOCAL]);
        var FLAG = new URL('__ruffle_drift__', document.baseURI).href;

        // SW 若标记过"CDN 版本已漂移、本地兜底对不上"，把本地源提到最前保证可用性。
        // 标记随 SW 缓存版本一起淘汰，所以同步了新的本地 ruffle 后会自动恢复走 CDN。
        function pickSources() {
            if (!window.caches) return Promise.resolve(SOURCES);
            return Promise.race([
                caches.match(FLAG).then(function (hit) { return hit ? [LOCAL].concat(CDNS) : SOURCES; }),
                new Promise(function (r) { setTimeout(function () { r(SOURCES); }, 1000); })
            ]).catch(function () { return SOURCES; });
        }

        // 这次落到本地源时，顺手 HEAD 探一下 CDN（几乎零流量）。CDN 通了就清掉漂移标记：
        // 下次恢复走 CDN，新版分片会被缓存下来，离线能力也随之跟上。
        function retireFlag(src) {
            if (src !== LOCAL || !window.caches) return;
            fetch(CDNS[0], { method: 'HEAD', mode: 'cors', cache: 'no-store' }).then(function (r) {
                if (!r.ok) return;
                caches.keys().then(function (names) {
                    names.forEach(function (n) {
                        caches.open(n).then(function (c) { c.delete(FLAG); });
                    });
                });
            }).catch(function () {});
        }

        function loadOne(src) {
            return new Promise(function (resolve, reject) {
                var s = document.createElement('script');
                var done = false;
                var timer = setTimeout(function () { fail('timeout'); }, TIMEOUT);
                function fail(reason) {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    if (s.parentNode) s.parentNode.removeChild(s);
                    reject(new Error(reason));
                }
                s.onload = function () {
                    if (done) return;
                    // 脚本能下载但没注册 RufflePlayer（例如 CDN 返回了错误页），同样算失败
                    if (!(window.RufflePlayer && window.RufflePlayer.newest)) return fail('invalid');
                    done = true;
                    clearTimeout(timer);
                    resolve(src);
                };
                s.onerror = function () { fail('error'); };
                s.async = false;
                // CDN 走 CORS，便于 Service Worker 校验真实状态码（避免缓存到错误响应）
                if (src.lastIndexOf(location.origin, 0) !== 0) s.crossOrigin = 'anonymous';
                s.src = src;
                (document.head || document.documentElement).appendChild(s);
            });
        }

        // 依次尝试，任一成功即停；全部失败时 reject
        function next(idx) {
            if (idx >= SOURCES.length) {
                return Promise.reject(new Error('Ruffle 加载失败（CDN 与本地兜底均不可用）'));
            }
            return loadOne(SOURCES[idx]).then(function (src) {
                try { localStorage.setItem(KEY, src); } catch (e) {}
                console.info('[Ruffle] 已加载：' + src);
                retireFlag(src);
                return src;
            }, function (err) {
                console.warn('[Ruffle] 源不可用：' + SOURCES[idx] + '（' + err.message + '），切换下一个');
                return next(idx + 1);
            });
        }

        window.__ruffleReady = pickSources().then(function (list) {
            SOURCES = list;
            return next(0);
        });
        window.__ruffleReady.catch(function () {});
    })();
    </script>

    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Material Icons：保留外部字体引用作为兜底（实际图标已内联为真实 baseline SVG，见 <body> 顶部 sprite） -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        /* ===== CSS Reset & Variables ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --md-primary: #6750A4;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #EADDFF;
            --md-on-primary-container: #21005D;
            --md-secondary: #625B71;
            --md-surface: #FEF7FF;
            --md-surface-variant: #E7E0EC;
            --md-surface-container: #F3EDF7;
            --md-surface-container-high: #ECE6F0;
            --md-on-surface: #1D1B20;
            --md-on-surface-variant: #49454F;
            --md-outline: #79747E;
            --md-outline-variant: #CAC4D0;
            --md-error: #B3261E;
            --md-on-error: #FFFFFF;
            --md-error-container: #F9DEDC;
            --md-on-error-container: #410E0B;
            --md-success: #386A20;
            --md-success-container: #C6ECA3;
            --md-shadow: rgba(0, 0, 0, 0.2);
            --md-thumb-gradient: linear-gradient(135deg, #D0BCFF 0%, #FFD8E4 100%);
            --md-radius-sm: 8px;
            --md-radius-md: 12px;
            --md-radius-lg: 16px;
            --md-radius-xl: 28px;
            --md-elevation-1: 0 1px 2px 0 rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
            --md-elevation-2: 0 1px 2px 0 rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15);
            --md-elevation-3: 0 1px 3px 0 rgba(0,0,0,0.3), 0 4px 8px 3px rgba(0,0,0,0.15);
            --md-elevation-4: 0 2px 3px 0 rgba(0,0,0,0.3), 0 6px 10px 4px rgba(0,0,0,0.15);
            --md-transition: 200ms cubic-bezier(0.2, 0, 0, 1);
        }

        /* ===== Dark Theme（基于 MD3 深色方案，紫色主色） ===== */
        :root[data-theme="dark"] {
            --md-primary: #D0BCFF;
            --md-on-primary: #381E72;
            --md-primary-container: #4F378B;
            --md-on-primary-container: #EADDFF;
            --md-secondary: #CCC2DC;
            --md-surface: #1D1B20;
            --md-surface-variant: #49454F;
            --md-surface-container: #211F26;
            --md-surface-container-high: #2B2930;
            --md-on-surface: #E6E0E9;
            --md-on-surface-variant: #CAC4D0;
            --md-outline: #938F99;
            --md-outline-variant: #49454F;
            --md-error: #F2B8B5;
            --md-on-error: #601410;
            --md-error-container: #8C1D18;
            --md-on-error-container: #F9DEDC;
            --md-success: #B1F18B;
            --md-success-container: #1F4F0F;
            --md-shadow: rgba(0, 0, 0, 0.5);
            --md-thumb-gradient: linear-gradient(135deg, #4F378B 0%, #352C4A 100%);
        }

        /* 切换主题时临时启用过渡，避免深浅“闪屏”硬切 */
        html.theme-anim, html.theme-anim * {
            transition: background-color 320ms cubic-bezier(0.2, 0, 0, 1),
                        color 320ms cubic-bezier(0.2, 0, 0, 1),
                        border-color 320ms cubic-bezier(0.2, 0, 0, 1),
                        box-shadow 320ms cubic-bezier(0.2, 0, 0, 1),
                        fill 320ms cubic-bezier(0.2, 0, 0, 1),
                        opacity 320ms cubic-bezier(0.2, 0, 0, 1),
                        transform 320ms cubic-bezier(0.2, 0, 0, 1) !important;
        }

        html, body {
            height: 100%;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--md-surface);
            color: var(--md-on-surface);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            /* ===== Prevent text selection globally ===== */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; /* iOS Safari: prevent long-press callout */
        }

        /* Allow text selection in input/textarea (search, rename dialog, etc.) */
        input, textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
            -webkit-touch-callout: default;
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--md-outline-variant); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--md-outline); }

        /* ===== Top App Bar ===== */
        .app-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 64px;
            background: var(--md-surface-container);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
            gap: 12px;
            transition: box-shadow var(--md-transition);
        }

        .app-bar.scrolled {
            box-shadow: var(--md-elevation-2);
        }

        .app-bar-title {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 0;
            flex: 1;
            color: var(--md-on-surface);
        }

        .app-bar-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--md-transition);
            -webkit-user-select: none;
            user-select: none;
        }

        .app-bar-icon:hover { background: rgba(103,80,164,0.08); }
        .app-bar-icon:active { background: rgba(103,80,164,0.12); }
        /* 移动端：禁用圆形按钮及内部图标的原生点击高亮（含 SVG，避免残留暗色圈） */
        #btn-theme, #btn-theme *, .app-bar-icon, .app-bar-icon * {
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }
        /* 触摸设备（hover:none）：保留按钮常态底色与“按下反馈”，消除安卓 WebView 触摸后
           粘性 :hover/:focus 导致的暗色底纹残留（PC 真实悬停移开即清，无此问题；高/低安卓手机才会滞留）。
           - 基础态只去焦点描边/点击高亮，保留按钮正常底色（FAB、主按钮、卡片底不变）。
           - :hover/:focus 背景强制透明（点完即恢复，不滞留）。
           - :active 用“原按钮 :hover 的颜色”作按下反馈：按下显示、松手即清（不滞留）；
             :active 规则置于 :hover 之后且同为 !important，故按下时优先生效。
           ripple 水波反馈保留；键盘焦点用 JS 的 e.detail===0 保留，兼顾无障碍。 */
        @media (hover: none) {
            button, a, [tabindex], .ripple, .swf-card, .app-bar-icon, .fab {
                outline: none !important;
                -webkit-tap-highlight-color: transparent;
                tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }
            /* 粘性 :hover / :focus 暗色底纹 → 立即清除（点完恢复，不滞留） */
            button:hover, button:focus, button:focus-visible,
            a:hover, a:focus, a:focus-visible,
            [tabindex]:hover, [tabindex]:focus, [tabindex]:focus-visible,
            .swf-card:hover, .swf-card:focus, .swf-card:focus-visible {
                background-color: transparent !important;
            }
            /* 实心底色按钮（FAB / 播放 / 对话框主按钮·危险按钮 / VK 切换）：安卓触摸后会保留粘性 :hover/:focus，
               若也走上面“透明”覆盖会变成透明消失、且不恢复。这里让它们保持自身常态底色，
               既不留暗色底纹也不会透明；与后面的 :active 按下反馈配合（:active 规则在后、优先生效）。 */
            .fab:hover, .fab:focus, .fab:focus-visible,
            .btn-play:hover, .btn-play:focus, .btn-play:focus-visible,
            .dialog-btn.primary:hover, .dialog-btn.primary:focus, .dialog-btn.primary:focus-visible {
                background: var(--md-primary) !important;
            }
            .dialog-btn.danger:hover, .dialog-btn.danger:focus, .dialog-btn.danger:focus-visible {
                background: var(--md-error) !important;
            }
            #btn-vk-toggle:hover, #btn-vk-toggle:focus, #btn-vk-toggle:focus-visible {
                background: rgba(103, 80, 164, 0.5) !important;
            }
            /* 虚拟键盘按键：常态深色底。安卓触摸后粘性 :hover 不能让它变透明/隐藏，
               故显式把 hover/focus 保持为常态底色；按下用 .pressed（JS）或 :active，保持紫色反馈；
               恢复过渡用自身 0.1s（不套用全局 220ms 慢淡出，避免抬起后背景“直接消失/卡顿”）。 */
            .vk-key:hover, .vk-key:focus, .vk-key:focus-visible {
                background-color: #2d2d4a !important;
                color: #e0e0e0 !important;
                outline: none !important;
            }
            .vk-key:active, .vk-key.pressed, .vk-key.pressed:hover {
                background-color: #6750A4 !important;
                color: #fff !important;
                transform: scale(0.92);
                transition: background-color 0.1s ease, transform 0.05s ease !important;
            }
            /* 按下反馈（颜色与原 :hover 一致）：按下时显示、松手即清，不滞留。
               兜底：未单独列出的按钮给统一淡紫按下反馈。 */
            button:active, a:active, [tabindex]:active { background-color: rgba(103,80,164,0.12) !important; }
            .app-bar-icon:active { background-color: rgba(103,80,164,0.12) !important; }
            .btn-play:active { background: #7965B0 !important; box-shadow: var(--md-elevation-1) !important; }
            .btn-delete:active { background: var(--md-error-container) !important; }
            .btn-rename:active, .btn-download:active { background: rgba(103,80,164,0.08) !important; color: var(--md-primary) !important; }
            .search-clear:active { background: rgba(103,80,164,0.12) !important; }
            .fab:active { background: #7965B0 !important; }
            #btn-vk-toggle:active { background: rgba(103, 80, 164, 0.7) !important; }
            .dialog-btn.text:active { background: rgba(103,80,164,0.08) !important; }
            .dialog-btn.danger:active { background: #9A1F1A !important; }
            .dialog-btn.primary:active { background: #7965B0 !important; }
            .swf-card:active { background-color: rgba(103,80,164,0.04) !important; }
            /* 松手后“恢复”延迟：仅给 :active 加缓慢过渡，按下后反馈色缓慢淡出（约 220ms），
               而非硬切消失；按下瞬间仍用元素自身过渡（响应迅速、反馈不减弱）。 */
            button:active, a:active, [tabindex]:active, .ripple:active, .swf-card:active, .app-bar-icon:active {
                transition: background-color 220ms ease !important;
            }
            .fab:active {
                transition: background-color 220ms ease, transform var(--md-transition), box-shadow var(--md-transition) !important;
            }
            /* 长按（不触发 click）的矩形选中框：低版本 Android 长按进入文本选择，显示矩形高亮+手柄，
               且短按的失焦逻辑（click）不会触发。这里让选中高亮透明（看不见矩形）、整页屏蔽长按呼出菜单、
               整页禁用文本选择（输入框/可编辑元素除外）。 */
            ::selection { background-color: transparent !important; }
            ::-moz-selection { background-color: transparent !important; }
            body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
            input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
        }
        /* 图标改为内联 SVG（真实 Material Icons baseline 路径数据，见 <body> 顶部 sprite）；外部 Material Icons 字体引用保留作兜底 */
        .material-icons {
            width: 1em;
            height: 1em;
            display: inline-block;
            vertical-align: middle;
            fill: currentColor;
            flex: none;
        }
        .app-bar-icon .material-icons { font-size: 24px; }

        /* 主题切换按钮：空心太阳 / 月亮，交叉淡入淡出 + 旋转 */
        #btn-theme {
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent; /* 去掉手机端点击后的暗色高亮圈 */
            tap-highlight-color: transparent;
            touch-action: manipulation; /* 避免移动端 300ms 点击延迟与误缩放 */
        }
        .theme-icon-wrap {
            position: relative;
            display: inline-flex;
            width: 22px;
            height: 22px;
        }
        .theme-icon {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 22px;
            height: 22px;
            transition: opacity 320ms cubic-bezier(0.2, 0, 0, 1),
                        transform 320ms cubic-bezier(0.2, 0, 0, 1);
        }
        /* 浅色模式：显示月亮（点击去深色），太阳淡出 */
        .theme-icon--sun  { opacity: 0; transform: rotate(90deg) scale(0.5); }
        .theme-icon--moon { opacity: 1; transform: rotate(0deg) scale(1); }
        /* 深色模式：显示太阳（点击回浅色），月亮淡出 */
        :root[data-theme="dark"] .theme-icon--sun  { opacity: 1; transform: rotate(0deg) scale(1); }
        :root[data-theme="dark"] .theme-icon--moon { opacity: 0; transform: rotate(-90deg) scale(0.5); }

        .app-bar .logo-icon {
            color: var(--md-primary);
        }

        /* ===== Main Content ===== */
        main {
            padding-top: 64px;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
            padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px));
        }

        /* ===== Section Header ===== */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 24px 0 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--md-primary);
            letter-spacing: 0.5px;
            text-transform: none;
        }

        .file-count-badge {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            font-size: 12px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 16px;
        }

        /* ===== Empty State ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 24px;
            min-height: 50vh;
        }

        .empty-state .empty-icon {
            font-size: 80px;
            color: var(--md-outline-variant);
            margin-bottom: 16px;
        }

        .empty-state h2 {
            font-size: 22px;
            font-weight: 400;
            color: var(--md-on-surface);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--md-on-surface-variant);
            line-height: 1.5;
            max-width: 360px;
            margin-bottom: 24px;
        }

        /* ===== SWF Card Grid ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .swf-card {
            background: var(--md-surface-container);
            border-radius: var(--md-radius-md);
            overflow: hidden;
            transition: box-shadow var(--md-transition), transform var(--md-transition);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .swf-card:hover {
            box-shadow: var(--md-elevation-2);
            transform: translateY(-2px);
        }

        .swf-card-thumb {
            height: 160px;
            background: var(--md-thumb-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .swf-card-thumb .thumb-icon {
            font-size: 56px;
            color: var(--md-primary);
            opacity: 0.7;
        }

        .swf-card-thumb .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--md-transition);
            cursor: pointer;
        }

        .swf-card-thumb:hover .play-overlay { opacity: 1; }

        .play-overlay .material-icons {
            font-size: 48px;
            color: white;
        }

        .swf-card-body {
            padding: 12px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .swf-card-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--md-on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .swf-card-meta {
            font-size: 12px;
            color: var(--md-on-surface-variant);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .swf-card-meta .material-icons {
            font-size: 14px;
        }

        .swf-card-actions {
            display: flex;
            gap: 4px;
            padding: 4px 8px 8px;
            align-items: center;
            justify-content: flex-end;
        }

        .card-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: none;
            border-radius: 20px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--md-transition), box-shadow var(--md-transition);
            -webkit-user-select: none;
            user-select: none;
        }

        .card-action-btn .material-icons { font-size: 18px; }

        .btn-play {
            background: var(--md-primary);
            color: var(--md-on-primary);
        }
        .btn-play:hover { background: #7965B0; box-shadow: var(--md-elevation-1); }

        .btn-delete {
            background: transparent;
            color: var(--md-error);
        }
        .btn-delete:hover { background: var(--md-error-container); }

        .btn-rename {
            background: transparent;
            color: var(--md-on-surface-variant);
        }
        .btn-rename:hover { background: rgba(103,80,164,0.08); color: var(--md-primary); }

        .btn-download {
            background: transparent;
            color: var(--md-on-surface-variant);
        }
        .btn-download:hover { background: rgba(103,80,164,0.08); color: var(--md-primary); }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            right: calc(24px + env(safe-area-inset-right, 0px));
            width: 56px;
            height: 56px;
            border-radius: 16px;
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
            touch-action: manipulation;
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--md-elevation-3);
            transition: box-shadow var(--md-transition), transform var(--md-transition), background var(--md-transition);
            z-index: 90;
        }

        .fab:hover {
            background: #7965B0;
            box-shadow: var(--md-elevation-4);
            transform: scale(1.05);
        }

        .fab:active {
            transform: scale(0.95);
        }

        .fab .material-icons { font-size: 24px; }

        .fab.extended {
            width: auto;
            padding: 0 20px;
            gap: 8px;
            border-radius: 16px;
        }

        .fab.extended .fab-label {
            font-size: 14px;
            font-weight: 500;
        }

        /* ===== Extended FAB on desktop ===== */
        @media (min-width: 600px) {
            .fab {
                bottom: calc(32px + env(safe-area-inset-bottom, 0px));
                right: calc(32px + env(safe-area-inset-right, 0px));
            }
        }

        /* ===== Player View ===== */
        .player-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .player-overlay.active {
            display: flex;
        }

        .player-topbar {
            height: 56px;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
            z-index: 10;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .player-topbar-title {
            flex: 1;
            color: #fff;
            font-size: 16px;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 8px;
        }

        .player-topbar button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--md-transition);
        }

        /* Only apply hover on devices that truly support it (mouse/trackpad).
           On touch devices :hover sticks after tap, causing a persistent
           "pressed" look. */
        @media (hover: hover) {
            .player-topbar button:hover {
                background: rgba(255,255,255,0.12);
            }
        }

        .player-topbar button .material-icons { font-size: 24px; }

        .player-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        #ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 播放器需保持聚焦态才能让物理键盘生效（Ruffle 的键盘监听依赖聚焦态）。
           聚焦时隐藏轮廓框，避免画布出现难看的焦点环。 */
        #ruffle-player:focus,
        #ruffle-player:focus-visible,
        #ruffle-player:focus-within {
            outline: none !important;
        }

        .player-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #1a1a2e;
            color: #fff;
        }

        .player-loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--md-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .player-loading p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Virtual Keyboard ===== */
        .virtual-keyboard {
            display: none;
            background: #1a1a2e;
            padding: 6px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            flex-shrink: 0;
        }

        .player-overlay.keyboard-active .virtual-keyboard {
            display: block;
        }

        .vk-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            align-items: stretch;
        }

        .vk-dpad {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(2, 44px);
            gap: 3px;
        }
        .vk-dpad .vk-key:nth-child(1) { grid-column: 2; grid-row: 1; }
        .vk-dpad .vk-key:nth-child(2) { grid-column: 1; grid-row: 2; }
        .vk-dpad .vk-key:nth-child(3) { grid-column: 2; grid-row: 2; }
        .vk-dpad .vk-key:nth-child(4) { grid-column: 3; grid-row: 2; }

        .vk-actions {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(3, 44px);
            gap: 3px;
        }

        .vk-bottom-row {
            display: flex;
            gap: 3px;
            align-items: center;
        }

        .vk-numbers {
            display: flex;
            gap: 3px;
            align-items: center;
            flex-wrap: wrap;
        }

        .vk-key {
            min-width: 44px;
            height: 44px;
            border-radius: 8px;
            border: none;
            background: #2d2d4a;
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s, transform 0.05s;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Pressed state is managed entirely by JS (.pressed class) via pointer
           events. The :active pseudo-class is intentionally NOT used because on
           touch devices it can "stick" after the finger lifts, leaving the key
           visually pressed. */
        .vk-key.pressed {
            background: #6750A4;
            color: #fff;
            transform: scale(0.92);
        }

        .vk-key.vk-sm {
            min-width: 36px;
            height: 36px;
            font-size: 12px;
        }

        .vk-key.vk-wide {
            min-width: 80px;
            flex: 1;
        }

        .vk-key.vk-arrow {
            font-size: 20px;
        }

        .player-overlay.keyboard-active .player-container {
            align-items: flex-start;
        }

        #btn-keyboard.active {
            background: rgba(103, 80, 164, 0.4);
        }

        /* ===== Keyboard Layout Switch Button (in player topbar) ===== */
        /* Pill-shaped button sitting left of the keyboard toggle in the topbar.
           Hidden by default; only visible while the virtual keyboard is open. */
        #btn-vk-toggle {
            display: none;
            width: auto;
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border-radius: 18px;
            border: none;
            background: rgba(103, 80, 164, 0.5);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            white-space: nowrap;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.05s;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) {
            #btn-vk-toggle:hover { background: rgba(103, 80, 164, 0.7); }
        }
        #btn-vk-toggle:active { transform: scale(0.96); }
        #btn-vk-toggle .material-icons { font-size: 18px; }

        /* Show the layout switch only while the virtual keyboard is visible */
        .player-overlay.keyboard-active #btn-vk-toggle {
            display: inline-flex;
        }

        /* Narrow screens: icon-only to save topbar space */
        @media (max-width: 480px) {
            #btn-vk-toggle { padding: 0 8px; }
            #btn-vk-toggle .vk-toggle-label { display: none; }
        }

        /* Compact layout keeps original flex-wrap behavior */
        .vk-layout-compact {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            align-items: stretch;
        }

        /* Full keyboard: column of rows, hidden by default */
        .vk-layout-full {
            display: none;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            padding: 0 4px;
        }

        .vk-row {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: nowrap;
        }

        /* Switch visibility */
        .virtual-keyboard.full-mode .vk-layout-compact { display: none; }
        .virtual-keyboard.full-mode .vk-layout-full { display: flex; }

        /* Full keyboard keys are a bit smaller to fit more keys */
        .vk-layout-full .vk-key {
            min-width: 32px;
            height: 36px;
            font-size: 12px;
        }
        .vk-layout-full .vk-key.vk-fn {
            min-width: 48px;
            font-size: 10px;
        }
        .vk-layout-full .vk-key.vk-backspace {
            min-width: 56px;
        }
        .vk-layout-full .vk-key.vk-space {
            min-width: 140px;
            flex: 1;
            max-width: 240px;
        }

        /* Mobile adjustments for full keyboard */
        @media (max-width: 600px) {
            .vk-layout-full {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                /* Hide the scrollbar — dragging the keyboard scrolls it (see
                   setupKeyboardDragScroll in JS). pan-y lets the page scroll
                   vertically while we handle the horizontal drag ourselves. */
                scrollbar-width: none;
                -ms-overflow-style: none;
                touch-action: pan-y;
            }
            .vk-layout-full::-webkit-scrollbar {
                display: none;
            }
            .vk-layout-full .vk-key {
                min-width: 26px;
                height: 32px;
                font-size: 11px;
            }
            .vk-layout-full .vk-key.vk-fn {
                min-width: 38px;
                font-size: 9px;
            }
            .vk-layout-full .vk-key.vk-backspace {
                min-width: 44px;
            }
            .vk-layout-full .vk-key.vk-space {
                min-width: 90px;
            }
        }

        /* Grab/grabbing cursor on mouse devices for the draggable keyboard */
        @media (hover: hover) and (max-width: 600px) {
            .vk-layout-full { cursor: grab; }
            .vk-layout-full.dragging { cursor: grabbing; }
        }

        /* Mobile: stack keyboard sections vertically */
        @media (max-width: 600px) {
            .virtual-keyboard {
                padding: 4px;
            }
            .vk-layout {
                gap: 4px;
            }
            .vk-dpad {
                grid-template-columns: repeat(3, 40px);
                grid-template-rows: repeat(2, 40px);
            }
            .vk-actions {
                grid-template-columns: repeat(3, 40px);
                grid-template-rows: repeat(3, 40px);
            }
            .vk-key {
                min-width: 40px;
                height: 40px;
                font-size: 13px;
            }
            .vk-key.vk-sm {
                min-width: 32px;
                height: 32px;
                font-size: 11px;
            }
            .vk-key.vk-wide {
                min-width: 60px;
            }
        }

        /* ===== Snackbar ===== */
        .snackbar {
            position: fixed;
            bottom: calc(90px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #322F35;
            color: #F5EFF7;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: var(--md-elevation-3);
            z-index: 2000;
            opacity: 0;
            transition: transform var(--md-transition), opacity var(--md-transition);
            max-width: 90vw;
            min-width: 280px;
            text-align: center;
            pointer-events: none;
        }

        .snackbar.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ===== Dialog ===== */
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .dialog-overlay.active {
            display: flex;
        }

        .dialog {
            background: var(--md-surface-container-high);
            border-radius: var(--md-radius-xl);
            max-width: 400px;
            width: 100%;
            padding: 24px;
            box-shadow: var(--md-elevation-3);
            animation: dialog-enter var(--md-transition);
        }

        @keyframes dialog-enter {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .dialog h3 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 16px;
            color: var(--md-on-surface);
        }

        .dialog p {
            font-size: 14px;
            color: var(--md-on-surface-variant);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .dialog-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--md-transition);
        }

        .dialog-btn.text {
            background: transparent;
            color: var(--md-primary);
        }
        .dialog-btn.text:hover { background: rgba(103,80,164,0.08); }

        .dialog-btn.danger {
            background: var(--md-error);
            color: var(--md-on-error);
        }
        .dialog-btn.danger:hover { background: #9A1F1A; }

        .dialog-btn.primary {
            background: var(--md-primary);
            color: var(--md-on-primary);
        }
        .dialog-btn.primary:hover { background: #7965B0; }

        /* Rename input */
        .rename-input-wrapper {
            display: flex;
            align-items: center;
            background: var(--md-surface-container);
            border-radius: var(--md-radius-sm);
            padding: 0 16px;
            margin-bottom: 24px;
            border: 2px solid var(--md-outline-variant);
            transition: border-color var(--md-transition);
        }

        .rename-input-wrapper:focus-within {
            border-color: var(--md-primary);
        }

        .rename-input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            color: var(--md-on-surface);
            outline: none;
            padding: 14px 0;
            min-width: 0;
        }

        .rename-suffix {
            color: var(--md-on-surface-variant);
            font-size: 15px;
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap;
        }

        /* ===== Ripple effect ===== */
        .ripple {
            position: relative;
            overflow: hidden;
        }

        /* 确保 FAB 的 .ripple 类不会覆盖 position: fixed */
        .fab.ripple {
            position: fixed;
        }

        .ripple-wave {
            position: absolute;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.3;
            transform: scale(0);
            animation: ripple 0.4s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        /* ===== Mobile responsive ===== */
        @media (max-width: 599px) {
            main {
                padding-left: 16px;
                padding-right: 16px;
            }

            .app-bar {
                height: 56px;
                padding: 0 8px;
            }

            main { padding-top: 56px; }

            .app-bar-title { font-size: 19px; }

            .card-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .fab {
                bottom: calc(32px + env(safe-area-inset-bottom, 0px));
                right: calc(16px + env(safe-area-inset-right, 0px));
                width: 56px;
                height: 56px;
            }

            .swf-card-thumb { height: 140px; }

            .snackbar {
                bottom: calc(100px + env(safe-area-inset-bottom, 0px));
                width: calc(100vw - 32px);
                min-width: auto;
            }
        }

        @media (min-width: 600px) and (max-width: 904px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ===== Search bar ===== */
        .search-bar {
            display: flex;
            align-items: center;
            background: var(--md-surface-container-high);
            border-radius: 28px;
            padding: 4px 4px 4px 16px;
            margin-bottom: 8px;
            gap: 8px;
            transition: box-shadow var(--md-transition);
        }

        .search-bar:focus-within {
            box-shadow: var(--md-elevation-1);
        }

        .search-bar .material-icons {
            color: var(--md-on-surface-variant);
            font-size: 22px;
        }

        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            color: var(--md-on-surface);
            outline: none;
            padding: 10px 0;
        }

        .search-bar input::placeholder {
            color: var(--md-on-surface-variant);
        }

        .search-clear {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-clear:hover { background: rgba(103,80,164,0.12); }

        /* hidden file input */
        #file-input { display: none; }

        /* Drag & drop */
        .drag-zone {
            position: fixed;
            inset: 0;
            background: rgba(103,80,164,0.1);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .drag-zone.active { display: flex; }

        .drag-zone-content {
            border: 3px dashed var(--md-primary);
            border-radius: 28px;
            padding: 48px 64px;
            text-align: center;
            background: var(--md-surface);
        }

        .drag-zone-content .material-icons {
            font-size: 64px;
            color: var(--md-primary);
        }

        .drag-zone-content p {
            font-size: 18px;
            color: var(--md-primary);
            margin-top: 12px;
            font-weight: 500;
        }
    </style>
</head>
