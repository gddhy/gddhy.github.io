            <div class="dialog-actions">
                <button class="dialog-btn text" id="btn-keep-current">继续当前播放</button>
                <button class="dialog-btn text" id="btn-add-list">仅添加到列表</button>
                <button class="dialog-btn primary" id="btn-load-new">加载新文件</button>
            </div>
        </div>
    </div>

    <!-- ===== Snackbar ===== -->
    <div class="snackbar" id="snackbar"></div>

    <script>
        // ==========================================
        //  IndexedDB Manager
        // ==========================================
        const DB_NAME = 'SWFPlayerDB';
        const DB_VERSION = 2;
        const STORE_NAME = 'swfFiles';
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };

                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        const store = database.createObjectStore(STORE_NAME, {
                            keyPath: 'id',
                            autoIncrement: true
                        });
                        store.createIndex('name', 'name', { unique: false });
                        store.createIndex('dateAdded', 'dateAdded', { unique: false });
                    }
                };
            });
        }

        function addFileToDB(file) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);

                const record = {
                    name: file.name,
                    size: file.size,
                    blob: file,
                    dateAdded: Date.now()
                };

                const request = store.add(record);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function getAllFiles() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function getFileById(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(id);

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function deleteFileFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function updateFileNameInDB(id, newName) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(id);

                request.onsuccess = () => {
                    const record = request.result;
                    if (record) {
                        record.name = newName;
                        const updateRequest = store.put(record);
                        updateRequest.onsuccess = () => resolve();
                        updateRequest.onerror = () => reject(updateRequest.error);
                    } else {
                        reject(new Error('文件不存在'));
                    }
                };
                request.onerror = () => reject(request.error);
            });
        }

        // ==========================================
        //  UI Helpers
        // ==========================================
        function showSnackbar(message, duration = 3000) {
            const snackbar = document.getElementById('snackbar');
            snackbar.textContent = message;
            snackbar.classList.add('show');
            clearTimeout(snackbar._timer);
            snackbar._timer = setTimeout(() => {
                snackbar.classList.remove('show');
            }, duration);
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';

            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        function rippleEffect(e) {
            const target = e.currentTarget;
            const rect = target.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width/2) - rect.left - size / 2;
            const y = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height/2) - rect.top - size / 2;

            const wave = document.createElement('span');
            wave.className = 'ripple-wave';
            wave.style.width = wave.style.height = size + 'px';
            wave.style.left = x + 'px';
            wave.style.top = y + 'px';

            target.appendChild(wave);
            setTimeout(() => wave.remove(), 400);
        }

        // ==========================================
        //  Render File List
        // ==========================================
        let allFiles = [];
        let searchQuery = '';

        async function refreshFileList() {
            allFiles = await getAllFiles();
            renderFileList();
        }

        function renderFileList() {
            const grid = document.getElementById('card-grid');
            const emptyState = document.getElementById('empty-state');
            const countBadge = document.getElementById('file-count');

            let filtered = allFiles;
            if (searchQuery) {
                filtered = allFiles.filter(f =>
                    f.name.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }

            countBadge.textContent = `${allFiles.length} 个文件`;

            if (allFiles.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'flex';
                return;
            }

            if (filtered.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'flex';
                emptyState.querySelector('h2').textContent = '未找到匹配的文件';
                emptyState.querySelector('p').textContent = `没有包含 "${searchQuery}" 的 SWF 文件`;
                setMaterialIcon(emptyState.querySelector('.empty-icon'), 'search_off');
                return;
            }

            emptyState.style.display = 'none';
            grid.style.display = 'grid';

            // Sort by dateAdded descending
            filtered.sort((a, b) => b.dateAdded - a.dateAdded);

            grid.innerHTML = filtered.map(file => `
                <div class="swf-card" data-id="${file.id}">
                    <div class="swf-card-thumb" onclick="playSWF(${file.id})">
                        <svg class="material-icons thumb-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-movie"/></svg>
                        <div class="play-overlay">
                            <svg class="material-icons" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-play_circle_filled"/></svg>
                        </div>
                    </div>
                    <div class="swf-card-body">
                        <div class="swf-card-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
                        <div class="swf-card-meta">
                            <svg class="material-icons" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-storage"/></svg>
                            <span>${formatFileSize(file.size)}</span>
                            <span>·</span>
                            <span>${formatDate(file.dateAdded)}</span>
                        </div>
                    </div>
                    <div class="swf-card-actions">
                        <button class="card-action-btn btn-play" onclick="playSWF(${file.id})">
                            <svg class="material-icons" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-play_arrow"/></svg>
                            播放
                        </button>
                        <button class="card-action-btn btn-rename" onclick="confirmRename(${file.id}, '${escapeHtml(file.name).replace(/'/g, "\\'")}')">
                            <svg class="material-icons" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-edit"/></svg>
                        </button>
                        <button class="card-action-btn btn-download" onclick="downloadFile(${file.id})">
                            <svg class="material-icons" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-download"/></svg>
                        </button>
                        <button class="card-action-btn btn-delete" onclick="confirmDelete(${file.id}, '${escapeHtml(file.name).replace(/'/g, "\\'")}')">
                            <svg class="material-icons" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-delete_outline"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 切换内联 SVG 图标的 symbol（动态更新全屏/键盘/空状态等图标，替代原先的 .textContent 改文字）
        function setMaterialIcon(svgEl, name) {
            if (!svgEl) return;
            const use = svgEl.querySelector ? svgEl.querySelector('use') : null;
            if (use) {
                use.setAttribute('href', '#ic-' + name);
                try { use.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#ic-' + name); } catch (_) {}
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==========================================
        //  File Operations
        // ==========================================
        async function handleFiles(files) {
            const allFiles = Array.from(files);
            const swfFiles = [];
            const invalidFiles = [];

            for (const f of allFiles) {
                if (isSWFFile(f)) {
                    swfFiles.push(f);
                } else {
                    invalidFiles.push(f);
                }
            }

            // Show snackbar for non-SWF files
            if (invalidFiles.length > 0) {
                if (invalidFiles.length === 1) {
                    showSnackbar(`"${invalidFiles[0].name}" 不是 SWF 文件，无法添加`);
                } else {
                    const names = invalidFiles.slice(0, 3).map(f => `"${f.name}"`).join('、');
                    const extra = invalidFiles.length > 3 ? ` 等 ${invalidFiles.length} 个文件` : '';
                    showSnackbar(`${names}${extra} 不是 SWF 文件，无法添加`);
                }
            }

            if (swfFiles.length === 0 && invalidFiles.length > 0) {
                return;
            }

            let success = 0;
            let fail = 0;
            for (const file of swfFiles) {
                try {
                    await addFileToDB(file);
                    success++;
                } catch (err) {
                    console.error('添加文件失败:', err);
                    fail++;
                }
            }

            if (success > 0) {
                const msg = invalidFiles.length > 0
                    ? `已添加 ${success} 个 SWF 文件，${invalidFiles.length} 个非 SWF 文件已跳过`
                    : `已添加 ${success} 个 SWF 文件`;
                showSnackbar(msg);
                await refreshFileList();
            } else if (fail > 0 && invalidFiles.length === 0) {
                showSnackbar('添加文件失败');
            }
        }

        /**
          * 安全判断文件是否为 SWF 文件（基于扩展名或 MIME 类型）
          * @param {any} file - 待检测的文件对象（通常为 File 或 Blob 实例）
          * @returns {boolean} 是 SWF 返回 true，否则 false
        */
        function isSWFFile(file) {
            // 1. 基础防御：确保 file 存在且为对象
            if (!file || typeof file !== 'object') {
                return false;
            }

            // 2. 安全获取 name 和 type，降级为空字符串
            const name = (typeof file.name === 'string') ? file.name.toLowerCase() : '';
            const type = (typeof file.type === 'string') ? file.type.toLowerCase() : '';

            // 3. 核心判断：扩展名或 MIME 类型精确匹配
            //    额外 trim 去除首尾空白（可选）
            return name.trim().endsWith('.swf') || type.trim() === 'application/x-shockwave-flash';
        }

        // Delete confirmation
        let pendingDeleteId = null;

        function confirmDelete(id, name) {
            pendingDeleteId = id;
            document.getElementById('delete-dialog-text').textContent =
                `确定要删除 "${name}" 吗？此操作无法撤销。`;
            document.getElementById('delete-dialog').classList.add('active');
        }

        async function executeDelete() {
            if (pendingDeleteId === null) return;

            try {
                await deleteFileFromDB(pendingDeleteId);
                showSnackbar('文件已删除');
                await refreshFileList();
            } catch (err) {
                console.error('删除失败:', err);
                showSnackbar('删除失败');
            } finally {
                pendingDeleteId = null;
                document.getElementById('delete-dialog').classList.remove('active');
            }
        }

        // Rename
        let pendingRenameId = null;

        function confirmRename(id, name) {
            pendingRenameId = id;
            // Strip .swf extension for editing
            const baseName = name.replace(/\.swf$/i, '');
            const input = document.getElementById('rename-input');
            input.value = baseName;
            document.getElementById('rename-dialog').classList.add('active');
            // Focus and select after dialog animation
            setTimeout(() => {
                input.focus();
                input.select();
            }, 100);
        }

        async function executeRename() {
            if (pendingRenameId === null) return;

            const input = document.getElementById('rename-input');
            const newName = input.value.trim();

            if (!newName) {
                showSnackbar('文件名不能为空');
                return;
            }

            // Check for invalid filename characters
            if (/[<>:"/\\|?*]/.test(newName)) {
                showSnackbar('文件名包含非法字符');
                return;
            }

            const fullName = newName + '.swf';

            try {
                await updateFileNameInDB(pendingRenameId, fullName);
                showSnackbar('文件名已修改');
                await refreshFileList();
            } catch (err) {
                console.error('重命名失败:', err);
                showSnackbar('重命名失败');
            } finally {
                pendingRenameId = null;
                document.getElementById('rename-dialog').classList.remove('active');
            }
        }

        // ==========================================
        //  Ruffle Player
        // ==========================================
        let currentPlayer = null;
        let currentBlobUrl = null;

        async function playSWF(id) {
            const file = await getFileById(id);
            if (!file) {
                showSnackbar('文件不存在');
                return;
            }

            // Show player overlay
            const overlay = document.getElementById('player-overlay');
            const container = document.getElementById('player-container');
            const titleEl = document.getElementById('player-title');

            titleEl.textContent = file.name;
            overlay.classList.add('active');

            // Ensure loading div is present
            ensureLoadingDiv(container);

            // Show loading overlay
            const loading = document.getElementById('player-loading');
            loading.style.display = 'flex';

            // Clean up previous player (only remove ruffle player, keep loading div)
            cleanupPlayer();

            // Create blob URL
            currentBlobUrl = URL.createObjectURL(file.blob);

            try {
                // Wait for Ruffle to be ready
                await waitForRuffle();

                // Configure Ruffle
                window.RufflePlayer = window.RufflePlayer || {};
                window.RufflePlayer.config = {
                    autoplay: 'on',
                    unmuteOverlay: 'visible',
                    backgroundColor: '#000000',
                    letterbox: 'on',
                    upgradeToSecureVersion: true,
                    maxExecutionDuration: 999,
                    logLevel: 'warn',
                    base: null,
                    menu: true,
                    salign: '',
                    scale: 'showAll',
                    quality: 'high',
                };

                const ruffle = window.RufflePlayer.newest();
                currentPlayer = ruffle.createPlayer();
                currentPlayer.id = 'ruffle-player';
                currentPlayer.tabIndex = 0;
                currentPlayer.style.width = '100%';
                currentPlayer.style.height = '100%';

                // Remove only old ruffle-player, keep loading div intact
                const oldPlayer = container.querySelector('#ruffle-player');
                if (oldPlayer) oldPlayer.remove();

                // Add player alongside loading div
                container.appendChild(currentPlayer);

                // Load the SWF
                await currentPlayer.load(currentBlobUrl);

                loading.style.display = 'none';

                // 加载完成后主动聚焦播放器：Ruffle 的键盘监听需要播放器处于聚焦态才会
                // 处理 keydown，否则物理键盘事件落在 body 上、游戏收不到。聚焦后游戏加载
                // 即可直接用物理键盘，无需先点一次虚拟键盘。
                try { currentPlayer.focus({ preventScroll: true }); } catch (_) {}

            } catch (err) {
                console.error('播放失败:', err);
                loading.innerHTML = `
                    <svg class="material-icons" style="font-size:48px; color:var(--md-error);" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-error_outline"/></svg>
                    <p>播放失败：${escapeHtml(err.message || '未知错误')}</p>
                `;
                loading.style.display = 'flex';
            }
        }

        // Ensure the loading div exists inside the container
        function ensureLoadingDiv(container) {
            let loading = document.getElementById('player-loading');
            if (!loading || !container.contains(loading)) {
                loading = document.createElement('div');
                loading.id = 'player-loading';
                loading.className = 'player-loading';
                loading.innerHTML = `
                    <div class="spinner"></div>
                    <p>正在加载 SWF 文件...</p>
                `;
                container.appendChild(loading);
            }
        }

        function waitForRuffle() {
            // 多 CDN 加载器（见 <head>）：优先等待它的最终结果
            if (window.__ruffleReady) return window.__ruffleReady.then(() => {});
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const check = () => {
                    attempts++;
                    if (window.RufflePlayer && window.RufflePlayer.newest) {
                        resolve();
                    } else if (attempts > 50) {
                        reject(new Error('Ruffle 加载超时'));
                    } else {
                        setTimeout(check, 100);
                    }
                };
                check();
            });
        }

        function cleanupPlayer() {
            if (currentPlayer) {
                try {
                    currentPlayer.remove();
                } catch(e) {}
                currentPlayer = null;
            }
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }
        }

        function closePlayer() {
            const overlay = document.getElementById('player-overlay');
            const container = document.getElementById('player-container');

            // Close virtual keyboard
            closeKeyboard();

            // Exit fullscreen if active
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }

            cleanupPlayer();

            // Ensure loading div exists and restore its content
            ensureLoadingDiv(container);
            const loading = document.getElementById('player-loading');
            loading.innerHTML = `
                <div class="spinner"></div>
                <p>正在加载 SWF 文件...</p>
            `;
            loading.style.display = 'none';

            overlay.classList.remove('active');
        }

        // ==========================================
        //  Fullscreen
        // ==========================================
        function toggleFullscreen() {
            const container = document.getElementById('player-container');
            const fullscreenIcon = document.querySelector('#btn-fullscreen .material-icons');

            if (!document.fullscreenElement) {
                // Close keyboard before entering fullscreen
                closeKeyboard();
                const el = container;
                const request = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
                if (request) {
                    request.call(el).then(() => {
                        setMaterialIcon(fullscreenIcon, 'fullscreen_exit');
                    }).catch(err => {
                        console.error('全屏失败:', err);
                        showSnackbar('无法进入全屏模式');
                    });
                }
            } else {
                document.exitFullscreen().then(() => {
                    setMaterialIcon(fullscreenIcon, 'fullscreen');
                }).catch(() => {});
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const fullscreenIcon = document.querySelector('#btn-fullscreen .material-icons');
            setMaterialIcon(fullscreenIcon, document.fullscreenElement ? 'fullscreen_exit' : 'fullscreen');
        });

        // ==========================================
        //  Virtual Keyboard
        // ==========================================
        let keyboardActive = false;
        let virtualKeyDispatching = false;

        function toggleKeyboard() {
            const overlay = document.getElementById('player-overlay');
            const kbBtn = document.getElementById('btn-keyboard');
            const kbIcon = kbBtn.querySelector('.material-icons');

            keyboardActive = !keyboardActive;

            if (keyboardActive) {
                // Exit fullscreen if active
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
                overlay.classList.add('keyboard-active');
                kbBtn.classList.add('active');
                setMaterialIcon(kbIcon, 'keyboard_hide');
                // Focus the player so keyboard events are received immediately
                if (currentPlayer) {
                    setTimeout(() => currentPlayer.focus({ preventScroll: true }), 100);
                }
            } else {
                overlay.classList.remove('keyboard-active');
                kbBtn.classList.remove('active');
                setMaterialIcon(kbIcon, 'keyboard');
            }
        }

        function closeKeyboard() {
            if (!keyboardActive) return;
            keyboardActive = false;
            const overlay = document.getElementById('player-overlay');
            const kbBtn = document.getElementById('btn-keyboard');
            const kbIcon = kbBtn.querySelector('.material-icons');
            overlay.classList.remove('keyboard-active');
            kbBtn.classList.remove('active');
            setMaterialIcon(kbIcon, 'keyboard');
        }

        function createKeyboardEvent(type, key, code, keyCode) {
            const event = new KeyboardEvent(type, {
                key: key,
                code: code,
                bubbles: true,
                cancelable: true,
                composed: true,
            });
            // keyCode/which are read-only in constructor, override via defineProperty
            try {
                Object.defineProperty(event, 'keyCode', { get: () => keyCode });
                Object.defineProperty(event, 'which', { get: () => keyCode });
            } catch(e) {}
            return event;
        }

        function sendKeyEvent(type, key, code, keyCode) {
            if (!currentPlayer) return;
            virtualKeyDispatching = true;
            try {
                // Ensure the player has focus before dispatching key events.
                // Ruffle's internal keyboard handler ignores events when the
                // player element (or its shadow-DOM canvas) is not the active
                // element. Clicking the virtual keyboard moves focus away, so
                // we must reclaim it before every dispatch.
                if (document.activeElement !== currentPlayer) {
                    currentPlayer.focus({ preventScroll: true });
                }

                // 只派发【一次】键盘事件，目标为播放器宿主 currentPlayer（与物理键盘一致）。
                // 物理键盘的原生 keydown 的 target 就是聚焦的 host，冒泡路径为 host → document，
                // canvas 作为 host 内部 shadow 的子节点【不在】事件路径上（事件不向后代传播），
                // 因此 Ruffle 挂在 canvas 上的监听不会触发，只会命中 host/document 监听 → 移动 1 格。
                // 若改为派发到 canvas，事件路径变成 canvas → host → document，会同时命中
                // canvas 监听与 host/document 监听，导致游戏收到两次 keydown → 移动 2 格。
                // 故这里固定派发到 host（currentPlayer），彻底对齐物理键盘的“一次按键一次移动”。
                currentPlayer.dispatchEvent(createKeyboardEvent(type, key, code, keyCode));
            } finally {
                virtualKeyDispatching = false;
            }
        }

        function setupVirtualKeyboard() {
            const keys = document.querySelectorAll('.vk-key');
            keys.forEach(keyEl => {
                const key = keyEl.dataset.key;
                const code = keyEl.dataset.code;
                const keyCode = parseInt(keyEl.dataset.keycode);

                const press = (e) => {
                    e.preventDefault();
                    keyEl.classList.add('pressed');
                    sendKeyEvent('keydown', key, code, keyCode);
                    // Release implicit pointer capture (Chrome sets it on touch
                    // pointerdown) so that pointerleave fires when the finger
                    // slides off the key, preventing a stuck "pressed" look.
                    if (e.pointerId !== undefined && keyEl.releasePointerCapture) {
                        try { keyEl.releasePointerCapture(e.pointerId); } catch (_) {}
                    }
                };

                const release = (e) => {
                    e.preventDefault();
                    keyEl.classList.remove('pressed');
                    sendKeyEvent('keyup', key, code, keyCode);
                };

                keyEl.addEventListener('pointerdown', press);
                keyEl.addEventListener('pointerup', release);
                keyEl.addEventListener('pointerleave', (e) => {
                    if (keyEl.classList.contains('pressed')) {
                        release(e);
                    }
                });
                keyEl.addEventListener('pointercancel', release);
                // Prevent context menu on long press
                keyEl.addEventListener('contextmenu', (e) => e.preventDefault());
            });
        }

        // Drag-to-scroll for the full keyboard on narrow screens where it
        // overflows horizontally. The scrollbar is hidden (see CSS); instead
        // the user drags the keyboard itself to scroll left/right.
        function setupKeyboardDragScroll() {
            const scroller = document.querySelector('.vk-layout-full');
            if (!scroller) return;

            let down = false;
            let dragging = false;
            let startX = 0;
            let startScroll = 0;
            const THRESHOLD = 6; // px of movement before a press becomes a drag

            scroller.addEventListener('pointerdown', (e) => {
                // Only engage when the keyboard actually overflows horizontally
                if (scroller.scrollWidth <= scroller.clientWidth) return;
                down = true;
                dragging = false;
                startX = e.clientX;
                startScroll = scroller.scrollLeft;
            });

            scroller.addEventListener('pointermove', (e) => {
                if (!down) return;
                const dx = e.clientX - startX;
                if (!dragging && Math.abs(dx) > THRESHOLD) {
                    dragging = true;
                    scroller.classList.add('dragging');
                }
                if (dragging) {
                    scroller.scrollLeft = startScroll - dx;
                    e.preventDefault();
                }
            });

            const end = () => {
                if (!down) return;
                down = false;
                if (dragging) {
                    dragging = false;
                    scroller.classList.remove('dragging');
                    // Suppress the click that follows a drag so a key isn't toggled
                    const suppress = (ev) => {
                        ev.preventDefault();
                        ev.stopPropagation();
                        scroller.removeEventListener('click', suppress, true);
                    };
                    scroller.addEventListener('click', suppress, true);
                }
            };

            scroller.addEventListener('pointerup', end);
            scroller.addEventListener('pointercancel', end);
            scroller.addEventListener('pointerleave', end);
        }

        // Switch between compact and full keyboard layouts
        function toggleKeyboardLayout() {
            const kb = document.getElementById('virtual-keyboard');
            const label = document.querySelector('#btn-vk-toggle .vk-toggle-label');
            const isFull = kb.classList.toggle('full-mode');
            label.textContent = isFull ? '精简键盘' : '完整键盘';
            // Clear any stuck "pressed" state from the previous layout
            kb.querySelectorAll('.vk-key.pressed').forEach(el => el.classList.remove('pressed'));
            // Reclaim focus for the player so key events keep flowing
            if (currentPlayer) {
                setTimeout(() => currentPlayer.focus({ preventScroll: true }), 50);
            }
        }

        // ==========================================
        //  Event Listeners
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            // ===== Prevent right-click context menu globally =====
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                return false;
            });

            // ===== Prevent text selection via drag (PC) =====
            document.addEventListener('selectstart', (e) => {
                // Allow selection inside input/textarea
                const tag = e.target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                e.preventDefault();
            });

            // ===== Prevent drag of text/images/elements (PC) =====
            // dragstart fires when dragging in-page elements (text, images, etc.).
            // File drag-and-drop from the OS uses dragenter/dragover/drop on
            // window, which are handled separately below and are NOT affected.
            document.addEventListener('dragstart', (e) => {
                e.preventDefault();
            });

            // Initialize DB
            try {
                await openDB();
                await refreshFileList();
            } catch (err) {
                console.error('数据库初始化失败:', err);
                showSnackbar('数据库初始化失败');
            }

            // ===== Theme (浅色 / 深色) =====
            const themeMeta = document.querySelector('meta[name="theme-color"]');
            let themeAnimTimer = null;
            function syncThemeMeta() {
                const dark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (themeMeta) themeMeta.setAttribute('content', dark ? '#211F26' : '#6750A4');
            }
            syncThemeMeta();

            // 全局：低版本 Android WebView 触摸/指针点击后焦点不自动清除，会残留矩形焦点框。
            // 对指针触发的点击（detail!==0）在下一帧主动失焦，让选中框立即消失；
            // 键盘触发（detail===0，即 Enter/Space）保留焦点，不影响无障碍。
            // 输入框/文本域（可输入）不在范围内，点它们不会被强制失焦。
            document.addEventListener('click', (e) => {
                if (e.detail === 0) return;
                const el = e.target.closest('button, a, [tabindex], .ripple, .swf-card');
                // 播放器聚焦态用于让物理键盘生效，点击画布时不要强制失焦（否则键盘失效）；
                // 其焦点框已由 CSS 隐藏，不会产生视觉残留。
                if (el && el !== currentPlayer && typeof el.blur === 'function') {
                    requestAnimationFrame(() => { try { el.blur(); } catch (_) {} });
                }
            }, false);

            // 长按（不触发 click）会残留矩形选中框/焦点框：低版本 Android WebView 不支持 Pointer Events
            // （需 Chrome 55 / Android 7+），上一轮挂在 pointerup/pointercancel 的清理在老安卓上根本不触发，
            // 只有短按（会合成 click）才被全局 click 失焦清掉。这里改用 Touch Events 兜底（全版本 Android 均支持），
            // 并额外在长按触发后主动清选择，压制“按住期间一直显示矩形框”。仅在触摸设备（hover:none）启用，PC 不受影响。
            if (window.matchMedia('(hover: none)').matches) {
                const isFormField = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
                const clearTouchFx = (target) => {
                    if (isFormField(target)) return;
                    const ae = document.activeElement;
                    // 不要夺走播放器的焦点（否则物理键盘失效）；其焦点框已由 CSS 隐藏。
                    if (ae && ae !== currentPlayer && typeof ae.blur === 'function' && !isFormField(ae)) {
                        try { ae.blur(); } catch (_) {}
                    }
                    try {
                        const s = window.getSelection();
                        if (s && s.removeAllRanges) s.removeAllRanges();
                    } catch (_) {}
                };
                // 松手 / 取消：清除残留焦点与文本选择（短按的合成 click 也会走这里，双保险）
                document.addEventListener('touchend', (e) => clearTouchFx(e.target), true);
                document.addEventListener('touchcancel', (e) => clearTouchFx(e.target), true);
                document.addEventListener('pointerup', (e) => clearTouchFx(e.target), true);
                document.addEventListener('pointercancel', (e) => clearTouchFx(e.target), true);
                // 屏蔽长按呼出的系统选择/复制菜单，并清除已出现的矩形选中高亮
                document.addEventListener('contextmenu', (e) => {
                    const t = e.target;
                    if (t && t.closest && t.closest('button, a, [tabindex], .ripple, .swf-card') && !isFormField(t)) {
                        e.preventDefault();
                        clearTouchFx(t);
                    }
                }, true);
                // 长按计时器：长按约 500ms 触发后，连续清除几次选择，压制“按住期间一直显示矩形框”。
                // 一旦移动（滚动）或松手即取消计时，避免误伤滚动与正常点击。
                document.addEventListener('touchstart', (e) => {
                    const t = e.target;
                    if (isFormField(t) || !t || !t.closest) return;
                    if (!t.closest('button, a, [tabindex], .ripple, .swf-card')) return;
                    const timer = setTimeout(() => {
                        clearTouchFx(t);
                        let n = 0;
                        const iv = setInterval(() => {
                            clearTouchFx(t);
                            if (++n >= 4) clearInterval(iv);
                        }, 60);
                    }, 500);
                    const stop = () => clearTimeout(timer);
                    e.currentTarget.addEventListener('touchend', stop, { once: true });
                    e.currentTarget.addEventListener('touchmove', stop, { once: true });
                    e.currentTarget.addEventListener('touchcancel', stop, { once: true });
                }, true);
            }

            document.getElementById('btn-theme').addEventListener('click', (e) => {
                const root = document.documentElement;
                const dark = root.getAttribute('data-theme') === 'dark';
                const next = dark ? 'light' : 'dark';
                // 临时启用过渡类，切换动画结束后移除，避免影响 hover 等常态动画
                root.classList.add('theme-anim');
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('swf-theme', next); } catch (e) {}
                syncThemeMeta();
                // 鼠标/触摸点击（detail!==0）后主动失焦，清除滞留的 :active / :focus 暗色圈；
                // 键盘触发（detail===0）保留焦点，不影响无障碍
                if (e.detail !== 0) {
                    try { document.getElementById('btn-theme').blur(); } catch (_) {}
                }
                if (themeAnimTimer) clearTimeout(themeAnimTimer);
                themeAnimTimer = setTimeout(() => root.classList.remove('theme-anim'), 380);
            });

            // FAB click -> open file dialog
            document.getElementById('fab-add').addEventListener('click', () => {
                document.getElementById('file-input').click();
            });

            // Top bar add button
            document.getElementById('btn-add-top').addEventListener('click', () => {
                document.getElementById('file-input').click();
            });

            // Add ripple to FAB
            document.getElementById('fab-add').classList.add('ripple');
            document.querySelectorAll('.ripple').forEach(el => {
                el.addEventListener('click', rippleEffect);
            });

            // File input change
            document.getElementById('file-input').addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFiles(e.target.files);
                    e.target.value = ''; // reset for re-selection
                }
            });

            // Search
            const searchInput = document.getElementById('search-input');
            const searchClear = document.getElementById('search-clear');

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                searchClear.style.display = searchQuery ? 'flex' : 'none';
                renderFileList();
            });

            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                searchClear.style.display = 'none';
                renderFileList();
            });

            // Player controls
            document.getElementById('btn-back').addEventListener('click', closePlayer);
            document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
            document.getElementById('btn-keyboard').addEventListener('click', toggleKeyboard);
            document.getElementById('btn-vk-toggle').addEventListener('click', toggleKeyboardLayout);

            // Virtual keyboard
            setupVirtualKeyboard();
            setupKeyboardDragScroll();

            // Delete dialog
            document.getElementById('btn-cancel-delete').addEventListener('click', () => {
                pendingDeleteId = null;
                document.getElementById('delete-dialog').classList.remove('active');
            });
            document.getElementById('btn-confirm-delete').addEventListener('click', executeDelete);

            // Close dialog on overlay click
            document.getElementById('delete-dialog').addEventListener('click', (e) => {
                if (e.target.id === 'delete-dialog') {
                    pendingDeleteId = null;
                    document.getElementById('delete-dialog').classList.remove('active');
                }
            });

            // Rename dialog
            document.getElementById('btn-cancel-rename').addEventListener('click', () => {
                pendingRenameId = null;
                document.getElementById('rename-dialog').classList.remove('active');
            });
            document.getElementById('btn-confirm-rename').addEventListener('click', executeRename);
            document.getElementById('rename-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    executeRename();
                }
            });
            document.getElementById('rename-dialog').addEventListener('click', (e) => {
                if (e.target.id === 'rename-dialog') {
                    pendingRenameId = null;
                    document.getElementById('rename-dialog').classList.remove('active');
                }
            });

            // App bar shadow on scroll
            window.addEventListener('scroll', () => {
                const appBar = document.getElementById('app-bar');
                if (window.scrollY > 0) {
                    appBar.classList.add('scrolled');
                } else {
                    appBar.classList.remove('scrolled');
                }
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                // Skip virtual keyboard dispatched events
                if (virtualKeyDispatching) return;

                if (e.key === 'Escape') {
                    if (document.getElementById('player-overlay').classList.contains('active')) {
                        if (!document.fullscreenElement) {
                            closePlayer();
                        }
                    }
                    if (document.getElementById('delete-dialog').classList.contains('active')) {
                        pendingDeleteId = null;
                        document.getElementById('delete-dialog').classList.remove('active');
                    }
                    if (document.getElementById('rename-dialog').classList.contains('active')) {
                        pendingRenameId = null;
                        document.getElementById('rename-dialog').classList.remove('active');
                    }
                }
                if (e.key === 'f' || e.key === 'F') {
                    if (document.getElementById('player-overlay').classList.contains('active')) {
                        toggleFullscreen();
                    }
                }
            });

            // ===== 物理键盘事件转发（无需先点击虚拟键盘）=====
            // Ruffle 的键盘监听挂在播放器宿主 currentPlayer 上，只有当该元素聚焦时，
            // 原生 keydown 才会命中它；游戏加载后 currentPlayer 默认未聚焦，物理键盘
            // 事件落在 body 上，Ruffle 收不到，必须先用虚拟键盘 focus() 一次才生效。
            // 这里在 document 层拦截物理键盘事件：当播放器未聚焦时将其转发到 currentPlayer，
            // 与虚拟键盘 sendKeyEvent 行为一致（仅派发一次到 host，避免重复移动）。
            // 这样游戏加载后即可直接使用物理键盘，无需先点击虚拟键盘。
            // Ruffle 的键盘监听依赖播放器的【内部聚焦态】（不仅仅是事件要到达 host），
            // 仅 dispatch 合成事件而不聚焦是无效的——这正是上一版转发器失效的原因。
            // 因此这里复用 sendKeyEvent（它会先 focus 播放器、再向 host 派发一次合成事件），
            // 与虚拟键盘生效路径完全一致：一旦焦点不在播放器，物理按键也会先聚焦再派发，
            // 游戏加载后（或焦点意外丢失后）按任意物理键即可直接生效，无需先点虚拟键盘。
            function forwardPhysicalKey(type, e) {
                if (virtualKeyDispatching) return;          // 虚拟键盘合成事件，跳过
                if (!currentPlayer) return;                 // 无播放器
                if (document.activeElement === currentPlayer) return; // 已聚焦，由 Ruffle 原生处理
                const ae = document.activeElement;
                if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return; // 输入控件内不转发
                // 复用 sendKeyEvent：先 focus 播放器（使其内部聚焦态生效），再向 host 派发一次，
                // 与虚拟键盘路径一致 → 一次按键一次响应，不重复移动。
                sendKeyEvent(type, e.key, e.code, e.keyCode || e.which || 0);
            }
            document.addEventListener('keydown', (e) => forwardPhysicalKey('keydown', e));
            document.addEventListener('keyup', (e) => forwardPhysicalKey('keyup', e));

            // Drag & Drop
            let dragCounter = 0;
            const dragZone = document.getElementById('drag-zone');

            window.addEventListener('dragenter', (e) => {
                e.preventDefault();
                dragCounter++;
                if (e.dataTransfer.types.includes('Files')) {
                    dragZone.classList.add('active');
                }
            });

            window.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dragCounter--;
                if (dragCounter <= 0) {
                    dragCounter = 0;
                    dragZone.classList.remove('active');
                }
            });

            window.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            window.addEventListener('drop', (e) => {
                e.preventDefault();
                dragCounter = 0;
                dragZone.classList.remove('active');
                if (e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            });

            // Prevent default drag behaviors
            ['dragend'].forEach(eventName => {
                document.addEventListener(eventName, () => {
                    dragCounter = 0;
                    dragZone.classList.remove('active');
                });
            });
        });

        // Download
        async function downloadFile(id) {
            try {
                const file = await getFileById(id);
                if (!file || !file.blob) {
                    showSnackbar('文件不存在');
                    return;
                }
                const url = URL.createObjectURL(file.blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showSnackbar('下载已开始');
            } catch (err) {
                console.error('下载失败:', err);
                showSnackbar('下载失败');
            }
        }

        // Expose functions for inline onclick
        window.playSWF = playSWF;
        window.confirmDelete = confirmDelete;
        window.confirmRename = confirmRename;
        window.downloadFile = downloadFile;

        // 弹出 MD 风格“打开冲突”弹窗：正在播放时又用系统打开方式启动了新文件。
        // 返回 Promise<string>：'replace'=加载新文件（关闭当前播放）；
        //                       'keep'=继续当前播放并结束流程；
        //                       'addToList'=仅将文件加入列表（不播放、不退出播放器）。
        function askOpenConflict() {
            return new Promise((resolve) => {
                const dlg = document.getElementById('open-conflict-dialog');
                const btnLoad = document.getElementById('btn-load-new');
                const btnKeep = document.getElementById('btn-keep-current');
                const btnAdd = document.getElementById('btn-add-list');

                const cleanup = () => {
                    dlg.classList.remove('active');
                    btnLoad.removeEventListener('click', onLoad);
                    btnKeep.removeEventListener('click', onKeep);
                    btnAdd.removeEventListener('click', onAdd);
                    dlg.removeEventListener('click', onOverlay);
                };
                const onLoad = () => { cleanup(); resolve('replace'); };
                const onKeep = () => { cleanup(); resolve('keep'); };
                const onAdd  = () => { cleanup(); resolve('addToList'); };
                // 点击遮罩层视为“继续当前播放”
                const onOverlay = (e) => { if (e.target === dlg) onKeep(); };

                btnLoad.addEventListener('click', onLoad);
                btnKeep.addEventListener('click', onKeep);
                btnAdd.addEventListener('click', onAdd);
                dlg.addEventListener('click', onOverlay);
                dlg.classList.add('active');
            });
        }

        // Register Service Worker for offline support.
        // Using a relative URL so it works under any deployment path (e.g. /swf/).
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then((reg) => {
                    console.log('[SW] registered, scope:', reg.scope);
                }).catch((err) => {
                    console.warn('[SW] registration failed:', err);
                });
            });
        }

        // ==========================================
        //  PWA File Handling（用系统“打开方式”启动）
        //  安装为 PWA 后，在系统文件管理器中用本应用打开 .swf 时触发：
        //   · 单个文件：判断是否为 SWF；是则加入本地列表并直接播放，否则提示不支持。
        //   · 多个文件：将其中所有 SWF 文件加入本地列表（不自动播放）。
        //  注意：launchParams.files 里是 FileSystemFileHandle，
        //  必须先 getFile() 转成真正的 File 对象才能取 name/size/blob。
        // ==========================================
        if ('launchQueue' in window) {
            window.launchQueue.setConsumer(async (launchParams) => {
                try {
                    if (!launchParams.files || launchParams.files.length === 0) {
                        return;
                    }

                    // 确保数据库就绪（PWA 冷启动时常早于 DOMContentLoaded）
                    if (!db) {
                        await openDB();
                    }

                    // 先把所有 handle 转成真正的 File 对象，后续各分支共用
                    const files = [];
                    for (const handle of launchParams.files) {
                        const file = handle.getFile ? await handle.getFile() : handle;
                        files.push(file);
                    }

                    // 窗口状态判断：
                    //  · 冷启动 / 已在列表页 → 无变化，直接执行原逻辑。
                    //  · 正在播放器/全屏播放界面 → 弹出 MD 弹窗询问用户：
                    //      - 继续当前播放(keep)：关闭弹窗，结束本次文件打开流程。
                    //      - 仅添加到列表(addToList)：把文件加入列表，不播放、不退播放器。
                    //      - 加载新文件(replace)：关闭播放器/退出全屏回到列表页，再执行原逻辑。
                    const playerOverlay = document.getElementById('player-overlay');
                    if (playerOverlay && playerOverlay.classList.contains('active')) {
                        // 记录弹窗前是否处于全屏（后续据此决定是否恢复全屏）
                        const wasFullscreen = !!document.fullscreenElement;
                        // 全屏元素处于浏览器“顶层(top layer)”，会盖住一切 z-index，
                        // 对话框无法置顶显示，因此先退出全屏再弹窗（仅当原本就全屏时）。
                        if (wasFullscreen) {
                            await document.exitFullscreen().catch(() => {});
                        }

                        const choice = await askOpenConflict();
                        if (choice === 'keep' || choice === 'addToList') {
                            if (choice === 'addToList') {
                                // 仅加入列表：不自动播放，不退出当前播放器界面
                                await handleFiles(files);
                            }
                            // 仅当弹窗前就是全屏才恢复全屏；原为窗口化则保持不变
                            if (wasFullscreen) {
                                const pc = document.getElementById('player-container');
                                if (pc && pc.requestFullscreen) {
                                    pc.requestFullscreen().catch(() => {});
                                }
                            }
                            return;
                        }
                        // choice === 'replace'：关闭播放器/退出全屏，回到列表页再执行原逻辑
                        closePlayer();
                    }

                    if (files.length === 1) {
                        // 单个文件：判断后加入列表并播放
                        const file = files[0];
                        if (isSWFFile(file)) {
                            const id = await addFileToDB(file);
                            await refreshFileList();
                            showSnackbar(`"${file.name}" 已添加`);
                            playSWF(id);
                        } else {
                            showSnackbar(`"${file.name}" 不是 SWF 文件，无法添加`);
                        }
                    } else {
                        // 多个文件：仅把其中的 SWF 加入列表
                        await handleFiles(files);
                    }
                } catch (err) {
                    console.error('处理打开的文件失败:', err);
                    showSnackbar('打开文件失败');
                }
            });
        }
    </script>
</html>
